<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>華沙傾城慢跑路線圖</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #d9cdb8;
  font-family: 'Segoe UI', 'PingFang TC', '微軟正黑體', Arial, sans-serif;
  padding: 20px;
  min-height: 100vh;
}
.card {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.22);
}
.header {
  background: linear-gradient(135deg, #0f2d5c 0%, #1e4b8f 60%, #2563a8 100%);
  padding: 20px 28px;
  color: white;
  display: flex;
  align-items: center;
  gap: 14px;
}
.header-icon { font-size: 2.4rem; }
.header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; }
.header p { font-size: 0.82rem; opacity: 0.72; margin-top: 5px; line-height: 1.5; }
svg { display: block; width: 100%; height: auto; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
  padding: 14px 22px;
  background: #f4f6f9;
  border-top: 1px solid #e2e8f0;
  align-items: center;
}
.li { display: flex; align-items: center; gap: 9px; font-size: 0.82rem; color: #2d3748; }
.li-line { width: 36px; height: 5px; border-radius: 3px; flex-shrink: 0; }
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid #e2e8f0;
}
.stat {
  padding: 13px 12px;
  text-align: center;
  border-right: 1px solid #e2e8f0;
}
.stat:last-child { border-right: none; }
.st-l { font-size: 0.65rem; color: #718096; text-transform: uppercase; letter-spacing: 0.06em; }
.st-v { font-size: 1.15rem; font-weight: 700; color: #1a202c; margin-top: 3px; }
@media (max-width: 540px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(2) { border-right: none; }
  .stat:nth-child(3) { border-top: 1px solid #e2e8f0; }
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-icon">🏃</div>
    <div>
      <h1>華沙傾城慢跑路線圖</h1>
      <p>Warsaw Jogging Route &nbsp;·&nbsp; 8字形環狀路線<br>
         去程 河岸水景（藍色）&nbsp;·&nbsp; 回程 林蔭大道（紅色）</p>
    </div>
  </div>

  <svg viewBox="0 0 840 620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Blue arrow for Day 1 -->
      <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1d4ed8"/>
      </marker>
      <!-- Mid-path blue arrow -->
      <marker id="arrowBM" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1d4ed8" opacity="0.85"/>
      </marker>
      <!-- Red arrow for Day 2 -->
      <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#b91c1c"/>
      </marker>
      <!-- Mid-path red arrow -->
      <marker id="arrowRM" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b91c1c" opacity="0.85"/>
      </marker>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
      </filter>
      <filter id="sh2" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
      </filter>
    </defs>

    <!-- ===== MAP BACKGROUND ===== -->
    <rect width="840" height="620" fill="#f2ead6"/>

    <!-- Subtle grid (streets) -->
    <g stroke="#e0d6be" stroke-width="1.2" opacity="0.55">
      <line x1="0" y1="160" x2="840" y2="160"/>
      <line x1="0" y1="270" x2="840" y2="270"/>
      <line x1="0" y1="380" x2="840" y2="380"/>
      <line x1="0" y1="490" x2="840" y2="490"/>
      <line x1="160" y1="0" x2="160" y2="620"/>
      <line x1="310" y1="0" x2="310" y2="620"/>
      <line x1="460" y1="0" x2="460" y2="620"/>
      <line x1="610" y1="0" x2="610" y2="620"/>
    </g>

    <!-- ===== VISTULA RIVER ===== -->
    <path d="M 670,0 Q 676,100 670,220 Q 664,340 670,460 Q 676,550 670,620
             L 725,620 Q 719,550 725,460 Q 731,340 725,220 Q 719,100 725,0 Z"
          fill="#93c5fd" opacity="0.75"/>
    <!-- River sheen -->
    <path d="M 675,0 Q 680,110 674,240 Q 668,360 674,480 Q 678,555 675,620
             L 681,620 Q 678,555 682,480 Q 676,360 682,240 Q 688,110 681,0 Z"
          fill="white" opacity="0.25"/>
    <!-- River label (rotated) -->
    <text transform="translate(698,300) rotate(90)" text-anchor="middle"
          font-size="11.5" fill="#1e40af" font-style="italic" opacity="0.7"
          font-family="Georgia, serif">維斯瓦河 Vistula River</text>

    <!-- ===== ŁAZIENKI PARK ===== -->
    <ellipse cx="490" cy="495" rx="120" ry="78" fill="#4ade80" opacity="0.22"/>
    <ellipse cx="490" cy="495" rx="120" ry="78" fill="none"
             stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.5"/>
    <text x="490" y="550" text-anchor="middle" font-size="9.5" fill="#15803d" opacity="0.8">
      Łazienki Park · 皇家浴場公園
    </text>

    <!-- ===== SAXON GARDEN ===== -->
    <rect x="248" y="202" width="82" height="62" rx="10"
          fill="#4ade80" opacity="0.22"/>
    <rect x="248" y="202" width="82" height="62" rx="10"
          fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,4" opacity="0.5"/>
    <text x="289" y="228" text-anchor="middle" font-size="9.5" fill="#166534">薩克森花園</text>
    <text x="289" y="241" text-anchor="middle" font-size="8.5" fill="#15803d" opacity="0.8">Saxon Garden</text>

    <!-- ===== UJAZDOWSKIE AVE (highlighted road) ===== -->
    <line x1="432" y1="120" x2="432" y2="540" stroke="#ca8a04" stroke-width="6" opacity="0.18"/>
    <line x1="432" y1="120" x2="432" y2="540" stroke="#ca8a04" stroke-width="2.5"
          stroke-dasharray="9,5" opacity="0.55"/>
    <!-- Ave label -->
    <text transform="translate(412,340) rotate(-90)" text-anchor="middle"
          font-size="9" fill="#92400e" opacity="0.7">烏亞茲多夫斯基大道 Aleje Ujazdowskie</text>

    <!-- ===== DAY 1 PATH – Blue ===== -->
    <!-- Segment 1: Hotel → Saxon Garden (slight NW detour) → back NE through crossing -->
    <path d="M 372,178
             C 342,188 268,210 274,228
             C 280,245 308,238 432,195"
          stroke="#1d4ed8" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          marker-mid="url(#arrowBM)" opacity="0.92"/>
    <!-- Segment 2: crossing → Royal Castle → River → south -->
    <path d="M 432,195
             C 480,178 530,160 548,158
             L 662,158
             Q 668,210 666,310
             Q 663,400 660,430
             C 645,435 620,432 594,430
             C 568,428 542,432 520,450
             C 500,466 478,488 465,505"
          stroke="#1d4ed8" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          marker-end="url(#arrowB)" opacity="0.92"/>

    <!-- ===== DAY 2 PATH – Red ===== -->
    <path d="M 469,509
             C 458,490 440,456 434,415
             C 428,378 430,330 431,280
             C 432,238 432,210 432,195
             C 432,183 415,177 372,178"
          stroke="#b91c1c" stroke-width="5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"
          marker-end="url(#arrowR)" opacity="0.92"/>
    <!-- Mid-arrow on Day 2 (north section) -->
    <path d="M 431,380 L 431,260"
          stroke="#b91c1c" stroke-width="0" fill="none"
          marker-end="url(#arrowRM)"/>
    <!-- Visible mid-arrow indicator -->
    <polygon points="427,308 435,308 431,296" fill="#b91c1c" opacity="0.75"/>

    <!-- ===== LANDMARK: HOTEL (Start / End) ===== -->
    <g filter="url(#sh)">
      <circle cx="372" cy="178" r="17" fill="#0f2d5c" stroke="white" stroke-width="3"/>
    </g>
    <text x="372" y="183" text-anchor="middle" fill="white" font-size="14" font-weight="bold">H</text>
    <!-- Label box -->
    <g filter="url(#sh2)">
      <rect x="316" y="143" width="112" height="30" rx="7" fill="#0f2d5c" opacity="0.92"/>
    </g>
    <text x="372" y="158" text-anchor="middle" fill="white" font-size="10" font-weight="bold">🏨 飯店（起終點）</text>

    <!-- ===== LANDMARK: SAXON GARDEN waypoint ===== -->
    <circle cx="274" cy="228" r="11" fill="#15803d" stroke="white" stroke-width="2.5"/>
    <text x="274" y="232.5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">①</text>

    <!-- ===== LANDMARK: ROYAL CASTLE ===== -->
    <g filter="url(#sh)">
      <rect x="532" y="143" width="28" height="26" rx="5" fill="#6d28d9" stroke="white" stroke-width="2.5"/>
    </g>
    <text x="546" y="160" text-anchor="middle" fill="white" font-size="12">🏰</text>
    <g filter="url(#sh2)">
      <rect x="562" y="135" width="96" height="32" rx="6" fill="#4c1d95" opacity="0.9"/>
    </g>
    <text x="610" y="147" text-anchor="middle" fill="white" font-size="10" font-weight="bold">② 皇家城堡</text>
    <text x="610" y="160" text-anchor="middle" fill="#ddd6fe" font-size="8.5">Royal Castle</text>

    <!-- River running text -->
    <text transform="translate(648,300) rotate(90)" text-anchor="middle"
          fill="#1d4ed8" font-size="9.5" font-weight="bold" opacity="0.65">
      ▼ Day 1 維斯瓦河岸南下
    </text>

    <!-- ===== LANDMARK: AGRYKOLA PARK ===== -->
    <circle cx="594" cy="432" r="10" fill="#15803d" stroke="white" stroke-width="2.5"/>
    <text x="594" y="436.5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">③</text>
    <g filter="url(#sh2)">
      <rect x="607" y="420" width="96" height="28" rx="5" fill="#166534" opacity="0.85"/>
    </g>
    <text x="655" y="432" text-anchor="middle" fill="white" font-size="9.5" font-weight="bold">Agrykola 公園</text>
    <text x="655" y="443" text-anchor="middle" fill="#bbf7d0" font-size="8">Agrykola Park</text>

    <!-- ===== LANDMARK: CHOPIN MONUMENT (Turning Point) ===== -->
    <g filter="url(#sh)">
      <circle cx="467" cy="507" r="18" fill="#991b1b" stroke="white" stroke-width="3"/>
    </g>
    <text x="467" y="502" text-anchor="middle" fill="white" font-size="13">🎹</text>
    <text x="467" y="516" text-anchor="middle" fill="white" font-size="8.5" font-weight="bold">折返</text>
    <!-- Chopin label box -->
    <g filter="url(#sh2)">
      <rect x="362" y="530" width="210" height="38" rx="8" fill="#7f1d1d" opacity="0.92"/>
    </g>
    <text x="467" y="545" text-anchor="middle" fill="white" font-size="10.5" font-weight="bold">④ 蕭邦紀念碑</text>
    <text x="467" y="560" text-anchor="middle" fill="#fca5a5" font-size="8.5">Chopin Monument · 折返點</text>

    <!-- ===== FIGURE-8 CROSSING MARKER ===== -->
    <circle cx="432" cy="195" r="9" fill="white" stroke="#7c3aed" stroke-width="2.8"/>
    <text x="432" y="199.5" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="bold">✕</text>
    <text x="443" y="188" text-anchor="start" fill="#5b21b6" font-size="9" font-weight="bold">8字交叉點</text>

    <!-- Day 2 direction label -->
    <text x="448" y="340" text-anchor="start" fill="#b91c1c" font-size="9.5" font-weight="bold" opacity="0.8">↑ 林蔭大道</text>
    <text x="448" y="354" text-anchor="start" fill="#b91c1c" font-size="8.5" opacity="0.7">北上回程</text>

    <!-- ===== DAY LABELS (top-left) ===== -->
    <g filter="url(#sh2)">
      <rect x="22" y="24" width="148" height="32" rx="8" fill="#1d4ed8" opacity="0.93"/>
    </g>
    <text x="96" y="44" text-anchor="middle" fill="white" font-size="11.5" font-weight="bold">Day 1 去程（藍色）</text>

    <g filter="url(#sh2)">
      <rect x="22" y="64" width="148" height="32" rx="8" fill="#b91c1c" opacity="0.93"/>
    </g>
    <text x="96" y="84" text-anchor="middle" fill="white" font-size="11.5" font-weight="bold">Day 2 回程（紅色）</text>

    <!-- ===== COMPASS ===== -->
    <g transform="translate(780,52)">
      <circle r="26" fill="white" stroke="#94a3b8" stroke-width="1.5" opacity="0.88"/>
      <!-- N arrow -->
      <polygon points="0,-18 -5,-6 5,-6" fill="#dc2626"/>
      <!-- S arrow -->
      <polygon points="0,18 -5,6 5,6" fill="#64748b"/>
      <text x="0" y="-21" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">N</text>
      <text x="0" y="30" text-anchor="middle" fill="#64748b" font-size="9">S</text>
      <text x="21" y="4" text-anchor="middle" fill="#64748b" font-size="9">E</text>
      <text x="-21" y="4" text-anchor="middle" fill="#64748b" font-size="9">W</text>
    </g>

    <!-- ===== SCALE BAR ===== -->
    <g transform="translate(55,592)">
      <rect x="-4" y="-10" width="94" height="22" rx="4" fill="white" opacity="0.7"/>
      <line x1="0" y1="0" x2="82" y2="0" stroke="#475569" stroke-width="2.5"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#475569" stroke-width="2.5"/>
      <line x1="41" y1="-3" x2="41" y2="3" stroke="#475569" stroke-width="1.5"/>
      <line x1="82" y1="-5" x2="82" y2="5" stroke="#475569" stroke-width="2.5"/>
      <text x="41" y="14" text-anchor="middle" fill="#334155" font-size="9.5">≈ 1 km</text>
    </g>

    <!-- Footnote -->
    <text x="420" y="611" text-anchor="middle" fill="#9ca3af" font-size="8.5">
      示意圖僅供參考，實際路線以現場路標為準
    </text>
  </svg>

  <div class="legend">
    <div class="li">
      <div class="li-line" style="background:#1d4ed8"></div>
      <span><strong>Day 1 去程</strong>：飯店 → 薩克森花園① → 皇家城堡② → 維斯瓦河岸南下 → Agrykola公園③ → 蕭邦紀念碑④</span>
    </div>
    <div class="li">
      <div class="li-line" style="background:#b91c1c"></div>
      <span><strong>Day 2 回程</strong>：蕭邦紀念碑④ → 烏亞茲多夫斯基大道直線北上 → 飯店</span>
    </div>
    <div class="li">
      <span style="color:#6d28d9; font-weight:600">✕ 8字交叉點</span>
      <span style="color:#6b7280">（去回程唯一交叉處，路線從此分叉）</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="st-l">全程距離</div>
      <div class="st-v">~10 km</div>
    </div>
    <div class="stat">
      <div class="st-l">Day 1 去程</div>
      <div class="st-v">~6 km</div>
    </div>
    <div class="stat">
      <div class="st-l">Day 2 回程</div>
      <div class="st-v">~4 km</div>
    </div>
    <div class="stat">
      <div class="st-l">路線形狀</div>
      <div class="st-v">8 字形</div>
    </div>
  </div>
</div>
</body>
</html>
